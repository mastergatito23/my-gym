<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>My GYM</title>

    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000" id="theme-color-meta">
    <link rel="apple-touch-icon" href="logo.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">

    <!-- Vercel Web Analytics -->
    <script>
        window.va = window.va || function () {
            (window.vaq = window.vaq || []).push(arguments);
        };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>

    <style>
        * {
            font-family: 'Manrope', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg-color: #000000;
            --card-bg: #111111;
            --card-border: #2a2a2a;
            --text-main: #ffffff;
            --text-muted: #a1a1aa;
            --accent: #c9f542;
            --accent-text: #000000;
            --nav-bg: rgba(17, 17, 17, 0.85);
            --toolbar-bg: #111111;
            --button-bg: #1a1a1a;
            --button-border: #333333;
        }

        body.light-mode {
            --bg-color: #f4f4f5;
            --card-bg: #ffffff;
            --card-border: #e4e4e7;
            --text-main: #09090b;
            --text-muted: #71717a;
            --accent: #a3e635;
            --accent-text: #0d1f00;
            --nav-bg: rgba(255, 255, 255, 0.85);
            --toolbar-bg: #ffffff;
            --button-bg: #f4f4f5;
            --button-border: #d4d4d8;
        }

        body {
            background: var(--bg-color);
            color: var(--text-main);
            overscroll-behavior: none;
            transition: background-color 0.25s ease, color 0.25s ease;
            padding-bottom: 80px;
        }

        .lime {
            color: var(--accent);
        }

        .bg-lime-accent {
            background-color: var(--accent);
            color: var(--accent-text);
        }

        .card-day {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s ease;
            width: 100%;
            text-align: left;
            cursor: pointer;
        }

            .card-day:active, .card-day:hover {
                border-color: var(--accent);
                transform: scale(1.01);
            }

            .card-day.today-card {
                border-color: var(--accent);
                box-shadow: 0 0 15px rgba(201, 245, 66, 0.15);
            }

        /* Tab Views */
        .tab-content {
            display: none;
        }

            .tab-content.active {
                display: block;
            }

        /* Bottom Navbar */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--nav-bg);
            backdrop-filter: blur(12px);
            border-top: 1px solid var(--card-border);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 10px 16px 14px;
            z-index: 40;
        }

        .nav-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: var(--text-muted);
            font-size: 11px;
            font-weight: 600;
            transition: color 0.2s;
            background: none;
            border: none;
            padding: 4px;
            cursor: pointer;
        }

            .nav-btn.active {
                color: var(--accent);
            }

        /* Editor */
        .editor {
            position: fixed;
            inset: 0;
            background: var(--bg-color);
            display: none;
            flex-direction: column;
            z-index: 50;
        }

            .editor.show {
                display: flex;
            }

        .editor-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px;
            border-bottom: 1px solid var(--card-border);
            background: var(--bg-color);
        }

        .editor-toolbar {
            display: flex;
            gap: 8px;
            padding: 12px 16px;
            border-bottom: 1px solid var(--card-border);
            background: var(--toolbar-bg);
            align-items: center;
            flex-wrap: wrap;
        }

            .editor-toolbar button {
                background: var(--button-bg);
                border: 1px solid var(--button-border);
                color: var(--text-main);
                width: 38px;
                height: 38px;
                border-radius: 10px;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 15px;
                cursor: pointer;
                transition: all 0.2s;
            }

                .editor-toolbar button:active {
                    background: var(--card-border);
                }

                .editor-toolbar button.active {
                    background: var(--accent);
                    color: var(--accent-text);
                    border-color: var(--accent);
                }

        #editor-content {
            flex: 1;
            padding: 20px 16px;
            outline: none;
            color: var(--text-main);
            overflow-y: auto;
            font-size: 16px;
            line-height: 1.6;
            background: var(--bg-color);
        }

            #editor-content:empty::before {
                content: attr(data-placeholder);
                color: var(--text-muted);
            }

            #editor-content img {
                max-width: 100%;
                height: auto;
                margin: 12px 0;
                border-radius: 12px;
                border: 1px solid var(--card-border);
            }

        .checklist-item {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 8px 0;
        }

            .checklist-item input[type="checkbox"] {
                cursor: pointer;
                width: 20px;
                height: 20px;
                accent-color: var(--accent);
                border-radius: 4px;
                flex-shrink: 0;
            }

                .checklist-item input[type="checkbox"]:checked + span {
                    text-decoration: line-through;
                    color: var(--text-muted);
                }

        #image-input {
            display: none;
        }

        /* Timer section custom elements */
        .timer-circle {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            border: 4px solid var(--card-border);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
            transition: border-color 0.3s ease;
        }

            .timer-circle.active {
                border-color: var(--accent);
                box-shadow: 0 0 25px rgba(201, 245, 66, 0.2);
            }
    </style>
</head>
<body>

    <div class="max-w-md mx-auto p-5">

        <!-- HEADER APP -->
        <div class="flex justify-between items-center mb-6">
            <div>
                <h1 class="text-3xl font-extrabold lime tracking-tight flex items-center gap-2">
                    My GYM
                </h1>
                <p id="user-greeting" class="text-xs mt-1" style="color: var(--text-muted);">Welcome, Guest!</p>
            </div>
        </div>

        <!-- TAB 1: RUTINAS -->
        <div id="tab-rutinas" class="tab-content active">
            <div class="flex items-center justify-between border-b pb-2.5 mb-4" style="border-color: var(--card-border);">
                <h2 class="text-lg font-bold flex items-center gap-2">
                    <i data-lucide="book-open" class="w-5 h-5 lime"></i> <span id="label-routines">Routines</span>
                </h2>
            </div>

            <div id="day-list" class="space-y-3"></div>
        </div>

        <!-- TAB 2: RELOJ -->
        <div id="tab-reloj" class="tab-content">
            <div class="flex items-center justify-between border-b pb-2.5 mb-6" style="border-color: var(--card-border);">
                <h2 class="text-lg font-bold flex items-center gap-2">
                    <i data-lucide="timer" class="w-5 h-5 lime"></i> <span id="label-clock">Timer & Rest</span>
                </h2>
            </div>

            <!-- TEMPORIZADOR DE DESCANSO -->
            <div class="p-5 rounded-2xl text-center border" style="background: var(--card-bg); border-color: var(--card-border);">
                <p class="text-xs font-semibold uppercase tracking-wider mb-4" style="color: var(--text-muted);" id="label-rest-timer">Rest Timer</p>

                <div id="timer-circle" class="timer-circle mb-6">
                    <span id="rest-display" class="text-4xl font-extrabold">00:00</span>
                    <span id="rest-label" class="text-xs mt-1 font-medium" style="color: var(--text-muted);">Ready for next set</span>
                </div>

                <!-- Botones de añadir tiempo -->
                <div class="grid grid-cols-2 gap-2 mb-3">
                    <button onclick="addRestTime(30)" class="py-2.5 rounded-xl font-bold text-sm border flex items-center justify-center gap-1" style="background: var(--button-bg); border-color: var(--button-border);">
                        <i data-lucide="plus" class="w-4 h-4 lime"></i> 30s
                    </button>
                    <button onclick="addRestTime(60)" class="py-2.5 rounded-xl font-bold text-sm border flex items-center justify-center gap-1" style="background: var(--button-bg); border-color: var(--button-border);">
                        <i data-lucide="plus" class="w-4 h-4 lime"></i> 60s
                    </button>
                </div>

                <!-- Tiempo Personalizado -->
                <div class="flex gap-2 mb-4">
                    <input id="custom-timer-input" type="number" min="1" max="600" placeholder="Seconds" class="flex-1 px-3 py-2.5 rounded-xl border text-sm text-center font-bold outline-none" style="background: var(--bg-color); color: var(--text-main); border-color: var(--card-border);">
                    <button onclick="startCustomRest()" class="px-4 py-2.5 rounded-xl font-bold text-sm border" style="background: var(--button-bg); border-color: var(--button-border);">
                        <span id="label-set">Set</span>
                    </button>
                </div>

                <button onclick="stopRestTimer()" class="w-full py-2.5 rounded-xl font-bold text-sm border text-red-400 border-red-900/30 bg-red-950/20" id="label-stop-timer">
                    Stop Timer
                </button>
            </div>
        </div>

        <!-- TAB 3: CONFIGURACIÓN -->
        <div id="tab-configuracion" class="tab-content">
            <div class="flex items-center justify-between border-b pb-2.5 mb-6" style="border-color: var(--card-border);">
                <h2 class="text-lg font-bold flex items-center gap-2">
                    <i data-lucide="settings" class="w-5 h-5 lime"></i> <span id="label-settings">Settings</span>
                </h2>
            </div>

            <div class="space-y-4">
                <!-- PERFIL -->
                <div class="p-4 rounded-2xl border" style="background: var(--card-bg); border-color: var(--card-border);">
                    <label class="block text-xs font-semibold mb-2" style="color: var(--text-muted);" id="label-athlete-name">Athlete Name</label>
                    <div class="flex gap-2">
                        <input id="user-name-input" type="text" placeholder="Your name" class="flex-1 px-3.5 py-2.5 rounded-xl border text-sm font-semibold outline-none" style="background: var(--bg-color); color: var(--text-main); border-color: var(--card-border);">
                        <button onclick="saveUsername()" class="px-4 py-2.5 rounded-xl font-bold text-sm bg-lime-accent" id="label-save">
                            Save
                        </button>
                    </div>
                </div>

                <!-- IDIOMA -->
                <div class="p-4 rounded-2xl border" style="background: var(--card-bg); border-color: var(--card-border);">
                    <label class="block text-xs font-semibold mb-2" style="color: var(--text-muted);" id="label-language">Language</label>
                    <select id="language-select" onchange="changeLanguage(this.value)" class="w-full px-3.5 py-2.5 rounded-xl border text-sm font-semibold" style="background: var(--bg-color); color: var(--text-main); border-color: var(--card-border);">
                        <option value="es">Español</option>
                        <option value="ca">Català</option>
                    </select>
                </div>

                <!-- APARIENCIA -->
                <div class="p-4 rounded-2xl border flex items-center justify-between" style="background: var(--card-bg); border-color: var(--card-border);">
                    <div>
                        <div class="font-bold text-sm" id="label-dark-mode">Dark Mode</div>
                        <div class="text-xs" style="color: var(--text-muted);" id="label-change-theme">Toggle the app theme</div>
                    </div>
                    <button id="theme-toggle-btn" onclick="toggleTheme()" class="px-4 py-2 rounded-xl text-xs font-bold border flex items-center gap-2" style="background: var(--button-bg); border-color: var(--button-border);">
                        <i data-lucide="sun" class="w-4 h-4"></i> <span id="theme-btn-text">Off</span>
                    </button>
                </div>

                <!-- COPIA DE SEGURIDAD -->
                <div class="p-4 rounded-2xl border space-y-3" style="background: var(--card-bg); border-color: var(--card-border);">
                    <div>
                        <div class="font-bold text-sm" id="label-backup-title">Backup & Restore</div>
                        <div class="text-xs" style="color: var(--text-muted);" id="label-backup-desc">Save or restore your workouts</div>
                    </div>

                    <div class="grid grid-cols-2 gap-2 pt-1">
                        <button onclick="exportBackup()" class="py-2.5 px-3 rounded-xl border text-xs font-bold flex items-center justify-center gap-2" style="background: var(--button-bg); border-color: var(--button-border);">
                            <i data-lucide="download" class="w-4 h-4 lime"></i> <span id="label-export">Export</span>
                        </button>
                        <button onclick="document.getElementById('import-file-input').click()" class="py-2.5 px-3 rounded-xl border text-xs font-bold flex items-center justify-center gap-2" style="background: var(--button-bg); border-color: var(--button-border);">
                            <i data-lucide="upload" class="w-4 h-4 lime"></i> <span id="label-import">Import</span>
                        </button>
                        <input id="import-file-input" type="file" accept=".json" class="hidden" onchange="importBackup(event)">
                    </div>
                </div>

                <!-- RESET DATA -->
                <div class="p-4 rounded-2xl border border-red-900/30 bg-red-950/10 flex items-center justify-between">
                    <div>
                        <div class="font-bold text-sm text-red-400" id="label-delete-routines">Delete All Workouts</div>
                        <div class="text-xs text-red-200/60" id="label-delete-desc">Remove all saved data</div>
                    </div>
                    <button onclick="clearAllData()" class="px-3.5 py-2 rounded-xl text-xs font-bold bg-red-600 text-white" id="label-delete">
                        Delete
                    </button>
                </div>
            </div>
        </div>

    </div>

    <!-- BOTTOM NAVBAR -->
    <nav class="bottom-nav">
        <button id="nav-rutinas" onclick="switchTab('rutinas')" class="nav-btn active">
            <i data-lucide="book-open" class="w-5 h-5"></i>
            <span id="nav-label-routines">Routines</span>
        </button>

        <button id="nav-reloj" onclick="switchTab('reloj')" class="nav-btn">
            <i data-lucide="timer" class="w-5 h-5"></i>
            <span id="nav-label-clock">Timer</span>
        </button>

        <button id="nav-configuracion" onclick="switchTab('configuracion')" class="nav-btn">
            <i data-lucide="settings" class="w-5 h-5"></i>
            <span id="nav-label-settings">Settings</span>
        </button>
    </nav>

    <!-- EDITOR OVERLAY -->
    <div id="editor" class="editor">
        <div class="editor-header">
            <button onclick="closeEditor()" class="p-2 rounded-lg text-sm font-bold flex items-center gap-1" style="color: var(--text-muted);">
                <i data-lucide="chevron-left" class="w-5 h-5"></i> <span id="label-back">Back</span>
            </button>

            <h3 id="editor-title" class="lime font-extrabold text-lg"></h3>

            <button onclick="save()" class="px-4 py-1.5 rounded-xl text-sm font-bold bg-lime-accent" id="label-editor-save">
                Save
            </button>
        </div>

        <div class="editor-toolbar">
            <button id="bold-btn" onmousedown="event.preventDefault()" onclick="toggleBold()" title="Bold">
                <strong>B</strong>
            </button>

            <button id="italic-btn" onmousedown="event.preventDefault()" onclick="toggleItalic()" title="Italic">
                <em>I</em>
            </button>

            <button onclick="insertImage()" title="Insert image">
                <i data-lucide="image" class="w-4 h-4"></i>
            </button>

            <button onclick="insertCheckbox()" title="Add checklist">
                <i data-lucide="check-square" class="w-4 h-4"></i>
            </button>

            <input id="image-input" type="file" accept="image/*">
        </div>

        <div id="editor-content" contenteditable="true" data-placeholder="Write your workout here..."></div>
    </div>

    <script>
        // LANGUAGE SYSTEM
        const translations = {
            es: {
                greeting: "¡Bienvenido/a, {name}!",
                guestGreeting: "¡Bienvenido, Usuario!",
                routines: "Rutinas",
                clock: "Reloj & Descansos",
                workoutSession: "Sesión de Entrenamiento",
                start: "Iniciar",
                pause: "Pausar",
                resume: "Reanudar",
                restTimer: "Temporizador de Descanso",
                readyForNextSet: "Listo para la serie",
                resting: "Descansando...",
                timeFinished: "¡Tiempo finalizado!",
                cancelled: "Cancelado",
                set: "Fijar",
                stopTimer: "Finalizar Temporizador",
                settings: "Configuración",
                athleteName: "Nombre del Atleta",
                yourName: "Tu nombre",
                save: "Guardar",
                language: "Idioma",
                darkMode: "Modo Oscuro",
                changeTheme: "Cambiar el tema de la aplicación",
                off: "Desactivado",
                on: "Activado",
                backupTitle: "Datos y Copia de Seguridad",
                backupDesc: "Exporta o importa tus rutinas guardadas",
                export: "Exportar",
                import: "Importar",
                deleteRoutines: "Borrar Rutinas",
                deleteDesc: "Eliminar todo el contenido guardado",
                delete: "Borrar",
                back: "Volver",
                noRoutine: "Sin rutina anotada",
                noContent: "Sin contenido",
                newExercise: "Nueva serie / ejercicio",
                restoreSuccess: "¡Rutinas restauradas con éxito!",
                invalidFile: "Archivo no válido.",
                confirmDelete: "¿Seguro que quieres borrar todas tus rutinas?",
                seconds: "Segundos",
                placeholder: "Escribe tu rutina aquí...",
            },
            ca: {
                greeting: "Benvingut/da, {name}!",
                guestGreeting: "Benvingut, Usuari!",
                routines: "Rutines",
                clock: "Rellotge & Descans",
                workoutSession: "Sessió d'Entrenament",
                start: "Iniciar",
                pause: "Pausa",
                resume: "Reprendre",
                restTimer: "Temporitzador de Descans",
                readyForNextSet: "Llest per a la sèrie següent",
                resting: "Descansant...",
                timeFinished: "¡Temps finalitzat!",
                cancelled: "Cancel·lat",
                set: "Establir",
                stopTimer: "Finalitzar Temporitzador",
                settings: "Configuració",
                athleteName: "Nom de l'Atleta",
                yourName: "El teu nom",
                save: "Guardar",
                language: "Idioma",
                darkMode: "Mode Fosc",
                changeTheme: "Canviar el tema de l'aplicació",
                off: "Desactivat",
                on: "Activat",
                backupTitle: "Dades i Còpia de Seguretat",
                backupDesc: "Exporta o importa les teves rutines guardades",
                export: "Exportar",
                import: "Importar",
                deleteRoutines: "Esborrar Rutines",
                deleteDesc: "Eliminar tot el contingut guardat",
                delete: "Esborrar",
                back: "Enrere",
                noRoutine: "Sense rutina anotada",
                noContent: "Sense contingut",
                newExercise: "Noves sèrie / exercici",
                restoreSuccess: "¡Rutines restaurades correctament!",
                invalidFile: "Arxiu no vàlid.",
                confirmDelete: "Estàs segur que vols esborrar totes les teves rutines?",
                seconds: "Segons",
                placeholder: "Escriu la teva rutina aquí...",
            }
        };

        const DAYS = {
            es: ["Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado", "Domingo"],
            ca: ["Dilluns", "Dimarts", "Dimecres", "Dijous", "Divendres", "Dissabte", "Diumenge"]
        };

        let records = [];
        let currentDay = null;
        let isLightMode = false;
        let currentLanguage = "en";

        // Timer Variables
        let restTimerInterval = null;
        let restSecondsLeft = 0;

        // Stopwatch Variables
        let swInterval = null;
        let swSeconds = 0;
        let swRunning = false;

        // TRANSLATION FUNCTION
        function t(key) {
            return translations[currentLanguage]?.[key] || translations.en[key] || key;
        }

        function updateAllText() {
            document.getElementById("label-routines").textContent = t("routines");
            document.getElementById("label-clock").textContent = t("clock");
            document.getElementById("label-workout-session").textContent = t("workoutSession");
            document.getElementById("sw-status-text").textContent = swRunning ? t("pause") : (swSeconds > 0 ? t("resume") : t("start"));
            document.getElementById("label-rest-timer").textContent = t("restTimer");
            document.getElementById("label-set").textContent = t("set");
            document.getElementById("label-stop-timer").textContent = t("stopTimer");
            document.getElementById("label-settings").textContent = t("settings");
            document.getElementById("label-athlete-name").textContent = t("athleteName");
            document.getElementById("label-save").textContent = t("save");
            document.getElementById("label-language").textContent = t("language");
            document.getElementById("label-dark-mode").textContent = t("darkMode");
            document.getElementById("label-change-theme").textContent = t("changeTheme");
            document.getElementById("label-backup-title").textContent = t("backupTitle");
            document.getElementById("label-backup-desc").textContent = t("backupDesc");
            document.getElementById("label-export").textContent = t("export");
            document.getElementById("label-import").textContent = t("import");
            document.getElementById("label-delete-routines").textContent = t("deleteRoutines");
            document.getElementById("label-delete-desc").textContent = t("deleteDesc");
            document.getElementById("label-delete").textContent = t("delete");
            document.getElementById("label-back").textContent = t("back");
            document.getElementById("label-editor-save").textContent = t("save");
            document.getElementById("nav-label-routines").textContent = t("routines");
            document.getElementById("nav-label-clock").textContent = t("clock");
            document.getElementById("nav-label-settings").textContent = t("settings");
            document.getElementById("user-name-input").placeholder = t("yourName");
            document.getElementById("custom-timer-input").placeholder = t("seconds");
            document.getElementById("editor-content").setAttribute("data-placeholder", t("placeholder"));
            
            // Update greeting
            const savedName = localStorage.getItem("mygym_username");
            if (savedName) {
                document.getElementById("user-greeting").textContent = t("greeting").replace("{name}", savedName);
            } else {
                document.getElementById("user-greeting").textContent = t("guestGreeting");
            }

            render();
        }

        function changeLanguage(lang) {
            currentLanguage = lang;
            localStorage.setItem("mygym_language", lang);
            document.documentElement.lang = lang;
            updateAllText();
        }

        // APP INIT
        function init() {
            // Load language
            const savedLanguage = localStorage.getItem("mygym_language") || "es";
            currentLanguage = savedLanguage;
            document.getElementById("language-select").value = savedLanguage;
            
            loadSettings();
            loadRecords();
            updateAllText();
            lucide.createIcons();
        }

        // TAB SWITCHING
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));

            document.getElementById(`tab-${tabId}`).classList.add('active');
            document.getElementById(`nav-${tabId}`).classList.add('active');
        }

        // LOAD & SAVE RECORDS
        function loadRecords() {
            const saved = localStorage.getItem("mygym");
            records = saved ? JSON.parse(saved) : [];
        }

        function saveData() {
            localStorage.setItem("mygym", JSON.stringify(records));
        }

        function render() {
            const list = document.getElementById("day-list");
            list.innerHTML = "";

            const todayName = new Intl.DateTimeFormat('es-ES', { weekday: 'long' }).format(new Date());
            const formattedToday = todayName.charAt(0).toUpperCase() + todayName.slice(1);

            const daysList = DAYS[currentLanguage] || DAYS.en;
            const todayIndex = new Date().getDay();
            const todayDayName = daysList[(todayIndex + 6) % 7];

            daysList.forEach(day => {
                const rec = records.find(r => r.day === day);
                const preview = rec ? strip(rec.content).slice(0, 50) : t("noContent");
                const isToday = day === todayDayName;

                const card = document.createElement("button");
                card.className = `card-day ${isToday ? 'today-card' : ''}`;

                card.innerHTML = `
                  <div>
                    <div class="font-bold flex items-center gap-2">
                      ${day}
                      ${isToday ? `<span class="text-[10px] px-2 py-0.5 rounded-full font-bold bg-lime-accent">TODAY</span>` : ''}
                    </div>
                    <div class="text-xs mt-1 text-ellipsis overflow-hidden" style="color: var(--text-muted);">${preview || t("noRoutine")}</div>
                  </div>
                  <i data-lucide="edit-3" class="w-4 h-4 lime"></i>
                `;

                card.onclick = () => openEditor(day);
                list.appendChild(card);
            });

            lucide.createIcons();
        }

        function strip(html) {
            const div = document.createElement("div");
            div.innerHTML = html || "";
            return (div.textContent || "").replace(/\s+/g, " ").trim();
        }

        // EDITOR FUNCTIONS
        function openEditor(day) {
            currentDay = day;
            const rec = records.find(r => r.day === day);
            document.getElementById("editor-content").innerHTML = rec?.content || "";
            document.getElementById("editor-title").textContent = day;
            document.getElementById("editor").classList.add("show");
        }

        function closeEditor() {
            document.getElementById("editor").classList.remove("show");
            currentDay = null;
        }

        function toggleBold() {
            document.execCommand("bold");
        }

        function toggleItalic() {
            document.execCommand("italic");
        }

        function insertImage() {
            document.getElementById("image-input").click();
        }

        document.getElementById("image-input").addEventListener("change", function (e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function (event) {
                const img = document.createElement("img");
                img.src = event.target.result;
                document.getElementById("editor-content").appendChild(img);
            };
            reader.readAsDataURL(file);
            e.target.value = "";
        });

        function insertCheckbox() {
            const editor = document.getElementById("editor-content");
            const container = document.createElement("div");
            container.className = "checklist-item";
            container.contentEditable = "false";

            const checkbox = document.createElement("input");
            checkbox.type = "checkbox";

            const label = document.createElement("span");
            label.textContent = t("newExercise");
            label.contentEditable = "true";

            container.appendChild(checkbox);
            container.appendChild(label);
            editor.appendChild(container);
        }

        function save() {
            if (!currentDay) return;
            const content = document.getElementById("editor-content").innerHTML;
            const existing = records.find(r => r.day === currentDay);

            if (existing) {
                existing.content = content;
            } else {
                records.push({ day: currentDay, content });
            }

            saveData();
            render();
            closeEditor();
        }

        // RELOJ: CRONÓMETRO DE ENTRENAMIENTO
        function toggleStopwatch() {
            const statusText = document.getElementById("sw-status-text");
            const icon = document.getElementById("sw-icon");

            if (swRunning) {
                clearInterval(swInterval);
                swRunning = false;
                statusText.textContent = t("resume");
                icon.setAttribute("data-lucide", "play");
            } else {
                swRunning = true;
                statusText.textContent = t("pause");
                icon.setAttribute("data-lucide", "pause");

                swInterval = setInterval(() => {
                    swSeconds++;
                    const hrs = String(Math.floor(swSeconds / 3600)).padStart(2, "0");
                    const mins = String(Math.floor((swSeconds % 3600) / 60)).padStart(2, "0");
                    const secs = String(swSeconds % 60).padStart(2, "0");
                    document.getElementById("stopwatch-display").textContent = `${hrs}:${mins}:${secs}`;
                }, 1000);
            }
            lucide.createIcons();
        }

        function resetStopwatch() {
            clearInterval(swInterval);
            swRunning = false;
            swSeconds = 0;
            document.getElementById("stopwatch-display").textContent = "00:00:00";
            document.getElementById("sw-status-text").textContent = t("start");
            document.getElementById("sw-icon").setAttribute("data-lucide", "play");
            lucide.createIcons();
        }

        // RELOJ: TEMPORIZADOR DE DESCANSO
        function addRestTime(seconds) {
            if (restTimerInterval && restSecondsLeft > 0) {
                restSecondsLeft += seconds;
                updateRestDisplay();
            } else {
                startRestTimer(seconds);
            }
        }

        function startCustomRest() {
            const input = document.getElementById("custom-timer-input");
            const secs = parseInt(input.value);
            if (secs && secs > 0) {
                startRestTimer(secs);
                input.value = "";
            }
        }

        function startRestTimer(seconds) {
            clearInterval(restTimerInterval);
            restSecondsLeft = seconds;

            const circle = document.getElementById("timer-circle");
            const display = document.getElementById("rest-display");
            const label = document.getElementById("rest-label");

            circle.classList.add("active");
            label.textContent = t("resting");

            updateRestDisplay();

            restTimerInterval = setInterval(() => {
                restSecondsLeft--;
                updateRestDisplay();

                if (restSecondsLeft <= 0) {
                    clearInterval(restTimerInterval);
                    restTimerInterval = null;
                    circle.classList.remove("active");
                    display.textContent = "00:00";
                    label.textContent = t("timeFinished");

                    if ("vibrate" in navigator) {
                        navigator.vibrate([300, 150, 300]);
                    }
                }
            }, 1000);
        }

        function updateRestDisplay() {
            const mins = String(Math.floor(restSecondsLeft / 60)).padStart(2, "0");
            const secs = String(restSecondsLeft % 60).padStart(2, "0");
            document.getElementById("rest-display").textContent = `${mins}:${secs}`;
        }

        function stopRestTimer() {
            clearInterval(restTimerInterval);
            restTimerInterval = null;
            restSecondsLeft = 0;
            document.getElementById("timer-circle").classList.remove("active");
            document.getElementById("rest-display").textContent = "00:00";
            document.getElementById("rest-label").textContent = t("cancelled");
        }

        // CONFIGURACIÓN: THEME & SETTINGS
        function loadSettings() {
            const savedTheme = localStorage.getItem("mygym_theme");
            if (savedTheme === "light") {
                isLightMode = true;
                document.body.classList.add("light-mode");
                document.getElementById("theme-btn-text").textContent = t("on");
                document.getElementById("theme-color-meta").setAttribute("content", "#f4f4f5");
            } else {
                document.getElementById("theme-btn-text").textContent = t("off");
            }

            const savedName = localStorage.getItem("mygym_username");
            if (savedName) {
                document.getElementById("user-name-input").value = savedName;
                document.getElementById("user-greeting").textContent = t("greeting").replace("{name}", savedName);
            }
        }

        function toggleTheme() {
            isLightMode = !isLightMode;
            if (isLightMode) {
                document.body.classList.add("light-mode");
                localStorage.setItem("mygym_theme", "light");
                document.getElementById("theme-btn-text").textContent = t("on");
                document.getElementById("theme-color-meta").setAttribute("content", "#f4f4f5");
            } else {
                document.body.classList.remove("light-mode");
                localStorage.setItem("mygym_theme", "dark");
                document.getElementById("theme-btn-text").textContent = t("off");
                document.getElementById("theme-color-meta").setAttribute("content", "#000000");
            }
        }

        function saveUsername() {
            const name = document.getElementById("user-name-input").value.trim();
            if (name) {
                localStorage.setItem("mygym_username", name);
                document.getElementById("user-greeting").textContent = t("greeting").replace("{name}", name);
            }
        }

        function exportBackup() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(records, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `mygym-backup-${new Date().toISOString().slice(0, 10)}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function importBackup(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function (evt) {
                try {
                    records = JSON.parse(evt.target.result);
                    saveData();
                    render();
                    alert(t("restoreSuccess"));
                } catch (err) {
                    alert(t("invalidFile"));
                }
            };
            reader.readAsText(file);
            e.target.value = "";
        }

        function clearAllData() {
            if (confirm(t("confirmDelete"))) {
                records = [];
                saveData();
                render();
            }
        }

        init();

        // SERVICE WORKER
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker.register("./service-worker.js").catch(() => { });
            });
        }
    </script>
</body>
</html>
